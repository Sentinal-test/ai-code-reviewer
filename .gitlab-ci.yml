# AI Code Reviewer — GitLab CI Pipeline
# Runs automatically on every Merge Request

stages:
  - review

variables:
  GIT_DEPTH: "0"   # Full clone for accurate diffs

ai_code_review:
  stage: review
  image: golang:1.24
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    LLM_PROVIDER: "gemini"
  cache:
    key: "ai-reviewer-${CI_PROJECT_ID}"
    paths:
      - .ai-reviewer/
  before_script:
    # Ensure full history connectivity for accurate diffs
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME":"refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --no-tags || git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" || true
    - git merge-base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" "$CI_COMMIT_SHA" || echo "⚠️ No merge base found — will use two-dot diff fallback"
  script:
    - echo "🏗️ Building AI Reviewer from origin/main..."
    # This keeps the reviewer binary pinned to the default branch, but it is NOT a
    # security boundary for MR pipelines. If this job exposes unprotected secrets,
    # a modified .gitlab-ci.yml in the MR can still run arbitrary commands with them.
    - git fetch origin main
    - git checkout origin/main -- backend/
    - cd backend
    - go build -o ../ai-reviewer cmd/cli/main.go
    - cd "$CI_PROJECT_DIR"
    - echo "🚀 Running AI Reviewer on MR !${CI_MERGE_REQUEST_IID}..."
    - ./ai-reviewer
        --scm-provider gitlab
        --token "$GITLAB_BOT_TOKEN"
        --api-url "$CI_API_V4_URL"
        --project-id "$CI_PROJECT_ID"
        --repo "$CI_PROJECT_PATH"
        --change-request "$CI_MERGE_REQUEST_IID"
        --sha "$CI_COMMIT_SHA"
        --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        --head "$CI_COMMIT_SHA"
        --llm-provider "$LLM_PROVIDER"
