name: 'AI Code Reviewer'
description: 'AI-powered code review running entirely within GitHub Actions'
  llm_provider:
    description: 'LLM Provider to use (gemini, openai, claude)'
    required: false
    default: 'gemini'
  gemini_api_key:
    description: 'Google Gemini API Key'
    required: false
  openai_api_key:
    description: 'OpenAI API Key'
    required: false
  anthropic_api_key:
    description: 'Anthropic API Key'
    required: false
  github_token:
    description: 'GitHub Token for posting comments'
    required: true
  pr_number:
    description: 'Pull Request Number'
    required: false
    default: ${{ github.event.pull_request.number }}
  base_ref:
    description: 'Base reference for diff'
    default: 'origin/main'
  head_ref:
    description: 'Head reference for diff'
    default: 'HEAD'
  allowed_domain:
    description: 'Optional: Organization domain'
    required: false
  app_id:
    description: 'Optional: GitHub App ID for multi-repo context'
    required: false
  app_private_key:
    description: 'Optional: GitHub App Private Key for multi-repo context'
    required: false
  review_rules:
    description: 'Optional: YAML block with custom review rules (instructions, ignore, focus)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        cache: false

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-

    - name: Cache Code Graph
      uses: actions/cache@v4
      with:
        path: .ai-reviewer
        key: code-graph-${{ github.repository }}-${{ github.event.pull_request.base.sha }}
        restore-keys: |
          code-graph-${{ github.repository }}-

    - name: Run AI Reviewer
      shell: bash
      env:
        LLM_PROVIDER_INPUT: ${{ inputs.llm_provider }}
        GEMINI_API_KEY_INPUT: ${{ inputs.gemini_api_key }}
        ORG_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENAI_API_KEY_INPUT: ${{ inputs.openai_api_key }}
        ORG_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY_INPUT: ${{ inputs.anthropic_api_key }}
        ORG_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        GITHUB_TOKEN_INPUT: ${{ inputs.github_token }}
        PR_NUMBER_INPUT: ${{ inputs.pr_number }}
        BASE_REF_INPUT: ${{ inputs.base_ref }}
        HEAD_REF_INPUT: ${{ inputs.head_ref }}
        APP_ID_INPUT: ${{ inputs.app_id }}
        APP_PRIVATE_KEY_INPUT: ${{ inputs.app_private_key }}
        REVIEW_RULES: ${{ inputs.review_rules }}
        # Support for Org-level secrets
        ORG_APP_ID: ${{ secrets.APP_ID }}
        ORG_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      run: |
        echo "🔍 Validating inputs..."
        
        # Multi-level API key resolution:
        #   1st: Explicit input via 'with: gemini_api_key'
        #   2nd: Organization-level GEMINI_API_KEY secret
        #   3rd: Runner's GEMINI_API_KEY environment variable
        
        RESOLVED_PROVIDER="${LLM_PROVIDER_INPUT:-gemini}"
        RESOLVED_API_KEY="${GEMINI_API_KEY_INPUT:-${ORG_GEMINI_API_KEY:-$GEMINI_API_KEY}}"
        RESOLVED_OPENAI_KEY="${OPENAI_API_KEY_INPUT:-${ORG_OPENAI_API_KEY:-$OPENAI_API_KEY}}"
        RESOLVED_ANTHROPIC_KEY="${ANTHROPIC_API_KEY_INPUT:-${ORG_ANTHROPIC_API_KEY:-$ANTHROPIC_API_KEY}}"
        RESOLVED_TOKEN="${GITHUB_TOKEN_INPUT:-$GITHUB_TOKEN}"
        
        # Resolve App Credentials (Input > Org Secret)
        RESOLVED_APP_ID="${APP_ID_INPUT:-$ORG_APP_ID}"
        RESOLVED_APP_PRIVATE_KEY="${APP_PRIVATE_KEY_INPUT:-$ORG_APP_PRIVATE_KEY}"

        if [ -n "$RESOLVED_API_KEY" ] || [ -n "$RESOLVED_OPENAI_KEY" ] || [ -n "$RESOLVED_ANTHROPIC_KEY" ]; then
          echo "✅ API Key resolved for $RESOLVED_PROVIDER"
        else
          echo "❌ Error: No LLM API key found for $RESOLVED_PROVIDER."
          exit 1
        fi

        # Export for subsequent tool use
        export LLM_PROVIDER="$RESOLVED_PROVIDER"
        export GEMINI_API_KEY="$RESOLVED_API_KEY"
        export OPENAI_API_KEY="$RESOLVED_OPENAI_KEY"
        export ANTHROPIC_API_KEY="$RESOLVED_ANTHROPIC_KEY"
        export GITHUB_TOKEN="$RESOLVED_TOKEN"

        echo "🏗️ Building AI Reviewer..."
        cd "${{ github.action_path }}/backend"
        go build -o ../ai-reviewer cmd/cli/main.go
        
        echo "🚀 Running AI Reviewer..."
        cd "${{ github.workspace }}"

        # Ensure base ref is available (handles shallow clones)
        if ! git rev-parse --verify "$BASE_REF_INPUT" >/dev/null 2>&1; then
          echo "⚠️  Base ref '$BASE_REF_INPUT' not found locally. Attempting to fetch..."
          if [[ "$BASE_REF_INPUT" == origin/* ]]; then
            REMOTE_BRANCH=${BASE_REF_INPUT#origin/}
            git fetch origin "$REMOTE_BRANCH" --depth=20
          else
            git fetch origin "$BASE_REF_INPUT" --depth=20
          fi
        fi

        # Check for merge base (handles shallow clones where base branch is known but history is missing)
        if ! git merge-base "$BASE_REF_INPUT" "$HEAD_REF_INPUT" >/dev/null 2>&1; then
          echo "⚠️  No merge base found between $BASE_REF_INPUT and $HEAD_REF_INPUT. Attempting to fetch more history..."
          if [[ "$BASE_REF_INPUT" == origin/* ]]; then
            REMOTE_BRANCH=${BASE_REF_INPUT#origin/}
            git fetch origin "$REMOTE_BRANCH" --depth=100
          else
            git fetch origin "$BASE_REF_INPUT" --depth=100
          fi
          
          # If still no merge base, try unshallowing (last resort)
          if ! git merge-base "$BASE_REF_INPUT" "$HEAD_REF_INPUT" >/dev/null 2>&1; then
             echo "⚠️  Still no merge base. Unshollowing and fetching all history..."
             git fetch --prune --unshallow || true
          fi
        fi

        "${{ github.action_path }}/ai-reviewer" \
          --llm-provider "$RESOLVED_PROVIDER" \
          --api-key "$RESOLVED_API_KEY" \
          --github-token "$RESOLVED_TOKEN" \
          --pr-number "${PR_NUMBER_INPUT:-$PR_NUMBER}" \
          --repo "$GITHUB_REPOSITORY" \
          --sha "$GITHUB_SHA" \
          --base "$BASE_REF_INPUT" \
          --head "$HEAD_REF_INPUT" \
          --app-id "$RESOLVED_APP_ID" \
          --app-private-key "$RESOLVED_APP_PRIVATE_KEY" \
          --review-rules "$REVIEW_RULES"
