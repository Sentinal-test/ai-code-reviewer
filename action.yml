name: 'AI Code Reviewer'
description: 'AI-powered code review running entirely within GitHub Actions'
inputs:
  gemini_api_key:
    description: 'Google Gemini API Key'
    required: true
  github_token:
    description: 'GitHub Token for posting comments'
    required: true
  pr_number:
    description: 'Pull Request Number'
    required: false
  base_ref:
    description: 'Base reference for diff'
    default: 'origin/main'
  head_ref:
    description: 'Head reference for diff'
    default: 'HEAD'

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25' # Matching go.mod

    - name: Run AI Reviewer
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        # Pass other env vars that the CLI expects
      run: |
        # We assume the action is checked out or the tool is available. 
        # For a self-contained action in the sane repo, we can run from source.
        # If this action is used by OTHERS, we might need to build valid binaries or docker.
        # Since the requirements say "The reviewer logic should be executable as: a CLI binary... inside the GitHub Actions runner",
        # and "Code never leaves...", compiling from source in the runner is safe and easy.
        
      run: |
        echo "Building AI Reviewer..."
        # We need to build the tool from the ACTION'S source code, not the user's repo.
        cd "${{ github.action_path }}/backend"
        
        # Build the binary and output it to the action root
        go build -v -o ../ai-reviewer cmd/cli/main.go
        
        echo "Running AI Reviewer..."
        # We go back to the workspace (implicitly or explicitly) to run git commands in the user's repo
        cd "${{ github.workspace }}"
        
        # Execute the binary we just built
        "${{ github.action_path }}/ai-reviewer" --base "${{ inputs.base_ref }}" --head "${{ inputs.head_ref }}"
