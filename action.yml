name: 'AI Code Reviewer'
description: 'AI-powered code review running entirely within GitHub Actions'
inputs:
  gemini_api_key:
    description: 'Google Gemini API Key'
    required: false
  github_token:
    description: 'GitHub Token for posting comments'
    required: true
  pr_number:
    description: 'Pull Request Number'
    required: false
    default: ${{ github.event.pull_request.number }}
  base_ref:
    description: 'Base reference for diff'
    default: 'origin/main'
  head_ref:
    description: 'Head reference for diff'
    default: 'HEAD'
  allowed_domain:
    description: 'Optional: Organization domain'
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        cache: false

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-

    - name: Cache Code Graph
      uses: actions/cache@v4
      with:
        path: .ai-reviewer
        key: code-graph-${{ github.repository }}-${{ github.event.pull_request.base.sha }}
        restore-keys: |
          code-graph-${{ github.repository }}-

    - name: Run AI Reviewer
      shell: bash
      env:
        GEMINI_API_KEY_INPUT: ${{ inputs.gemini_api_key }}
        ORG_DEFAULT_GEMINI_KEY: ${{ secrets.ORG_DEFAULT_GEMINI_KEY }} # Optional Org-wide default
        GITHUB_TOKEN_INPUT: ${{ inputs.github_token }}
        PR_NUMBER_INPUT: ${{ inputs.pr_number }}
        BASE_REF_INPUT: ${{ inputs.base_ref }}
        HEAD_REF_INPUT: ${{ inputs.head_ref }}
      run: |
        echo "🔍 Validating inputs..."
        
        # Multi-level API key resolution (this is why gemini_api_key is required: false):
        #   1st: Explicit input via 'with: gemini_api_key' (per-repo override)
        #   2nd: ORG_DEFAULT_GEMINI_KEY secret (org-wide default, set on this action's repo)
        #   3rd: GEMINI_API_KEY env var (legacy fallback)
        # We only fail if ALL THREE are missing.
        RESOLVED_API_KEY="${GEMINI_API_KEY_INPUT:-${ORG_DEFAULT_GEMINI_KEY:-$GEMINI_API_KEY}}"
        RESOLVED_TOKEN="${GITHUB_TOKEN_INPUT:-$GITHUB_TOKEN}"
        
        if [ -n "$RESOLVED_API_KEY" ]; then
          echo "✅ API Key resolved (starts with: ${RESOLVED_API_KEY:0:4}...)"
        else
          echo "❌ Error: No Gemini API key found in any of the 3 sources."
          echo "Checked (in order): inputs.gemini_api_key → secrets.ORG_DEFAULT_GEMINI_KEY → env.GEMINI_API_KEY"
          echo ""
          echo "Fix: Set one of the following:"
          echo "  Option A: Add ORG_DEFAULT_GEMINI_KEY secret to this action's repository (recommended)"
          echo "  Option B: Pass gemini_api_key explicitly: gemini_api_key: \${{ secrets.GEMINI_API_KEY }}"
          exit 1
        fi

        # Export for subsequent tool use
        export GEMINI_API_KEY="$RESOLVED_API_KEY"
        export GITHUB_TOKEN="$RESOLVED_TOKEN"

        echo "🏗️ Building AI Reviewer..."
        cd "${{ github.action_path }}/backend"
        go build -o ../ai-reviewer cmd/cli/main.go
        
        echo "🚀 Running AI Reviewer..."
        cd "${{ github.workspace }}"
        
        "${{ github.action_path }}/ai-reviewer" \
          --api-key "$RESOLVED_API_KEY" \
          --github-token "$RESOLVED_TOKEN" \
          --pr-number "${PR_NUMBER_INPUT:-$PR_NUMBER}" \
          --repo "$GITHUB_REPOSITORY" \
          --sha "$GITHUB_SHA" \
          --base "$BASE_REF_INPUT" \
          --head "$HEAD_REF_INPUT"
