name: 'AI Code Reviewer'
description: 'AI-powered code review running entirely within GitHub Actions'
inputs:
  gemini_api_key:
    description: 'Google Gemini API Key'
    required: true
  github_token:
    description: 'GitHub Token for posting comments'
    required: true
  pr_number:
    description: 'Pull Request Number'
    required: false
    default: ${{ github.event.pull_request.number }}
  base_ref:
    description: 'Base reference for diff'
    default: 'origin/main'
  head_ref:
    description: 'Head reference for diff'
    default: 'HEAD'
  allowed_domain:
    description: 'Optional: Organization domain'
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24' # Matching go.mod
        cache-dependency-path: ${{ github.action_path }}/backend/go.sum

    - name: Run AI Reviewer
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
      run: |
        echo "Building AI Reviewer..."
        # We need to build the tool from the ACTION'S source code
        cd "${{ github.action_path }}/backend"
        
        # Build the binary
        go build -v -o ../ai-reviewer cmd/cli/main.go
        
        echo "Running AI Reviewer..."
        # Return to workspace to run git commands
        cd "${{ github.workspace }}"
        
        # Execute the binary
        "${{ github.action_path }}/ai-reviewer" --base "${{ inputs.base_ref }}" --head "${{ inputs.head_ref }}"
