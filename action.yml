name: 'AI Code Reviewer'
description: 'AI-powered code review running entirely within GitHub Actions'
inputs:
  gemini_api_key:
    description: 'Google Gemini API Key'
    required: true
  github_token:
    description: 'GitHub Token for posting comments'
    required: true
  pr_number:
    description: 'Pull Request Number'
    required: false
    default: ${{ github.event.pull_request.number }}
  base_ref:
    description: 'Base reference for diff'
    default: 'origin/main'
  head_ref:
    description: 'Head reference for diff'
    default: 'HEAD'
  allowed_domain:
    description: 'Optional: Organization domain'
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24' # Matching go.mod
        cache-dependency-path: ${{ github.action_path }}/backend/go.sum

    - name: Run AI Reviewer
      shell: bash
      env:
        # Map inputs to environment variables for the script
        # We use a fallback logic here: prioritize inputs.gemini_api_key
        # but also accept GEMINI_API_KEY if passed directly via env: block in caller
        GEMINI_API_KEY_INPUT: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN_INPUT: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
      run: |
        echo "🔍 Validating inputs..."
        
        # Resolve the API Key: Priority Input -> Env
        API_KEY="${GEMINI_API_KEY_INPUT:-$GEMINI_API_KEY}"
        
        if [ -n "$API_KEY" ]; then
          echo "✅ API Key detected."
          # Print the first few characters for verification (safe for secrets)
          echo "Debug: API Key starts with: ${API_KEY:0:4}..."
        else
          echo "❌ Error: GEMINI_API_KEY is missing."
          echo "Please ensure you pass it in the 'with:' block of your workflow:"
          echo "  with:"
          echo "    gemini_api_key: \${{ secrets.GEMINI_API_KEY }}"
          exit 1
        fi

        # Export for subsequent tool use if needed
        export GEMINI_API_KEY="$API_KEY"
        export GITHUB_TOKEN="${GITHUB_TOKEN_INPUT:-$GITHUB_TOKEN}"

        echo "🏗️ Building AI Reviewer..."


        # We need to build the tool from the ACTION'S source code
        cd "${{ github.action_path }}/backend"
        
        # Build the binary
        go build -v -o ../ai-reviewer cmd/cli/main.go
        
        echo "🚀 Running AI Reviewer..."
        # Return to workspace to run git commands
        cd "${{ github.workspace }}"
        
        # Execute the binary with flags for better reliability
        "${{ github.action_path }}/ai-reviewer" \
          --api-key "$GEMINI_API_KEY" \
          --github-token "$GITHUB_TOKEN" \
          --pr-number "$PR_NUMBER" \
          --repo "$GITHUB_REPOSITORY" \
          --sha "$GITHUB_SHA" \
          --base "${{ inputs.base_ref }}" \
          --head "${{ inputs.head_ref }}"

